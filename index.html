<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Penjemputan</title>
    
    <meta name="theme-color" content="#2563EB">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3204/3204005.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Menu Dasbor</h2>
            <button id="closeSidebar" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="#" id="menuDasbor"><i class="fas fa-chart-pie"></i> Dasbor Utama</a></li>
            <li><a href="#" id="menuBelum"><i class="fas fa-list-ul"></i> Belum Berdonasi</a></li>
        </ul>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="main-content">
        <header class="topbar">
            <button id="openSidebar" class="burger-btn"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Dasbor Kinerja</h1>
        </header>

        <div class="filter-area">
            <select id="filterPetugas" class="dropdown-biru">
                <option value="Semua">Semua Petugas</option>
            </select>
            <select id="filterPekan" class="dropdown-biru">
                <option value="Total">Total Bulan Ini</option>
                <option value="Pekan 1">Pekan 1</option>
                <option value="Pekan 2">Pekan 2</option>
                <option value="Pekan 3">Pekan 3</option>
                <option value="Pekan 4">Pekan 4</option>
            </select>
        </div>

        <div id="areaDasbor">
            <div class="summary-cards">
                <div class="card">
                    <h3>Persentase</h3>
                    <h2 id="teksPersentase">0%</h2>
                </div>
                <div class="card">
                    <h3>Kewajiban</h3>
                    <h2 id="teksKewajiban">0</h2>
                </div>
                <div class="card">
                    <h3>Berhasil</h3>
                    <h2 id="teksBerhasil">0</h2>
                </div>
                <div class="card">
                    <h3>Pemasukan</h3>
                    <h2 id="teksPemasukan">Rp 0</h2>
                </div>
            </div>
            <div class="charts-area">
                <div class="chart-container">
                    <h3>Perorangan (Rutin)</h3>
                    <canvas id="grafikOrang"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Kotak (IKP vs IIP)</h3>
                    <canvas id="grafikKotak"></canvas>
                </div>
            </div>
        </div>

        <div id="areaBelum" style="display: none;">
            <h2 style="margin-bottom: 15px; font-size: 18px; color: #1F2937;">Daftar Sisa Penjemputan</h2>
            <div id="wadahDaftarBelum">
                </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</body>
</html>
