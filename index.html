<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor LAZ Sidogiri</title>
    <meta name="theme-color" content="#2E5B72">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center;">
                <img src="logo.png" alt="Logo" style="height: 30px; margin-right: 8px;">
            </div>
            <button id="closeSidebar" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="#" id="menuDasbor" class="aktif"><i class="fas fa-chart-pie"></i> DASBOR UTAMA</a></li>
            <li><a href="#" id="menuRekap"><i class="fas fa-users"></i> REKAP PETUGAS</a></li>
            <li><a href="#" id="menuBelum"><i class="fas fa-list-ul"></i> BELUM BERDONASI</a></li>
        </ul>
    </div>
    <div id="overlay" class="overlay"></div>

    <div class="main-content">
        <header class="topbar">
            <button id="openSidebar" class="burger-btn"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">DASHBOR KINERJA</h1>
        </header>

        <div id="areaFilterGlobal" class="filter-area">
            <select id="filterPetugas" class="dropdown-aksen"><option value="Semua">SEMUA PETUGAS</option></select>
            <select id="filterPekan" class="dropdown-aksen">
                <option value="Total">TOTAL BULAN INI</option>
                <option value="Pekan 1">PEKAN 1</option><option value="Pekan 2">PEKAN 2</option>
                <option value="Pekan 3">PEKAN 3</option><option value="Pekan 4">PEKAN 4</option>
            </select>
        </div>

        <div id="areaDasbor">
            <div class="summary-cards">
                <div class="card card-lime">
                    <i class="fas fa-chart-line watermark-icon"></i>
                    <h3>PERSENTASE</h3><h2 id="teksPersentase">0%</h2>
                </div>
                <div class="card card-lime">
                    <i class="fas fa-hand-holding-heart watermark-icon"></i>
                    <h3>TERJEMPUT</h3><h2 id="teksBerhasil">0</h2>
                </div>
                <div class="card card-lime">
                    <i class="fas fa-wallet watermark-icon"></i>
                    <h3>PEMASUKAN</h3><h2 id="teksPemasukan">Rp 0</h2>
                </div>
                
                <div class="card card-muda">
                    <i class="fas fa-user-clock watermark-icon"></i>
                    <h3>KEWAJIBAN RUTIN</h3>
                    <h2 id="teksRutin">0</h2>
                    <div id="teksBaruRutin" class="teks-baru">+0</div>
                    <div id="teksSisaRutin" class="teks-sisa">-0</div>
                </div>
                <div class="card card-muda">
                    <i class="fas fa-box watermark-icon"></i>
                    <h3>KEWAJIBAN IKP</h3>
                    <h2 id="teksIKP">0</h2>
                    <div id="teksBaruIKP" class="teks-baru">+0</div>
                    <div id="teksSisaIKP" class="teks-sisa">-0</div>
                </div>
                <div class="card card-muda">
                    <i class="fas fa-store watermark-icon"></i>
                    <h3>KEWAJIBAN IIP</h3>
                    <h2 id="teksIIP">0</h2>
                    <div id="teksBaruIIP" class="teks-baru">+0</div>
                    <div id="teksSisaIIP" class="teks-sisa">-0</div>
                </div>
            </div>
            
            <div class="charts-area">
                <div class="chart-container">
                    <h3>Realisasi Target & Insidental</h3>
                    <div style="height: 380px; position: relative;"><canvas id="grafikUtama"></canvas></div>
                </div>
            </div>
        </div>

        <div id="areaRekap" style="display: none; padding: 0 15px;">
            <div class="header-halaman">
                <h2>Klasemen & Rekap Kinerja</h2>
            </div>
            <div id="wadahRekap"></div>
        </div>

        <div id="areaBelum" style="display: none; padding: 0 15px;">
            <div class="filter-area-lokal">
                <select id="filterBelumPetugas" class="dropdown-lokal"></select>
                <select id="filterBelumPekan" class="dropdown-lokal">
                    <option value="Total">TOTAL BULAN INI</option>
                    <option value="Pekan 1">PEKAN 1</option><option value="Pekan 2">PEKAN 2</option>
                    <option value="Pekan 3">PEKAN 3</option><option value="Pekan 4">PEKAN 4</option>
                </select>
            </div>
            
            <div class="header-halaman flex-header">
                <h2>Sisa (<span id="totalSisaBelum">0</span> Donatur)</h2>
                <select id="filterJenisDonatur" class="dropdown-kecil">
                    <option value="Semua">SEMUA KAT</option><option value="RUTIN">RUTIN</option>
                    <option value="IKP">IKP</option><option value="IIP">IIP</option>
                </select>
            </div>
            
            <div id="wadahDaftarBelum"></div>
            <div id="wadahTombolMuat" style="text-align: center; margin: 15px 0 30px 0;"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
