<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Penjemputan - LAZ Sidogiri</title>
    
    <meta name="theme-color" content="#2E5B72">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center;">
                <img src="logo.png" alt="Logo" style="height: 35px; margin-right: 10px;">
                <h2 style="font-size: 16px;">LAZ Sidogiri</h2>
            </div>
            <button id="closeSidebar" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="#" id="menuDasbor"><i class="fas fa-chart-pie"></i> Dasbor Utama</a></li>
            <li><a href="#" id="menuBelum"><i class="fas fa-list-ul"></i> Belum Berdonasi</a></li>
        </ul>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="main-content">
        <header class="topbar">
            <button id="openSidebar" class="burger-btn"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Dasbor Kinerja</h1>
        </header>

        <div class="filter-area">
            <select id="filterPetugas" class="dropdown-aksen">
                <option value="Semua">Semua Petugas</option>
            </select>
            <select id="filterPekan" class="dropdown-aksen">
                <option value="Total">Total Bulan Ini</option>
                <option value="Pekan 1">Pekan 1</option>
                <option value="Pekan 2">Pekan 2</option>
                <option value="Pekan 3">Pekan 3</option>
                <option value="Pekan 4">Pekan 4</option>
            </select>
        </div>

        <div id="areaDasbor">
            <div class="summary-cards">
                <div class="card card-petrol">
                    <h3>Persentase</h3>
                    <h2 id="teksPersentase">0%</h2>
                </div>
                <div class="card card-muda">
                    <h3>Kewajiban</h3>
                    <h2 id="teksKewajiban">0</h2>
                </div>
                <div class="card card-lime">
                    <h3>Berhasil</h3>
                    <h2 id="teksBerhasil">0</h2>
                </div>
                <div class="card card-lime">
                    <h3>Pemasukan</h3>
                    <h2 id="teksPemasukan">Rp 0</h2>
                </div>
            </div>
            
            <div class="charts-area">
                <div class="chart-container">
                    <h3>Performa Terpadu</h3>
                    <p style="font-size: 10px; text-align: center; color: #6B7280; margin-bottom: 10px;">
                        Luar: Rutin | Tengah: IKP | Dalam: IIP
                    </p>
                    <div style="position: relative; height: 300px;">
                        <canvas id="grafikMultiLevel"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="areaBelum" style="display: none;">
            <div class="header-halaman">
                <h2 style="font-size: 16px;">Sisa Penjemputan</h2>
                <select id="filterJenisDonatur" class="dropdown-kecil">
                    <option value="Semua">Semua Jenis</option>
                    <option value="RUTIN">Rutin</option>
                    <option value="IKP">IKP</option>
                    <option value="IIP">IIP</option>
                </select>
            </div>
            <div id="wadahDaftarBelum"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
